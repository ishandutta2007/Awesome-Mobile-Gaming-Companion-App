<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 44px; fill: url(#textGrad); letter-spacing: -0.5px; }
    .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; letter-spacing: 0.5px; }
    .badge-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; }
    
    /* Dynamic Animated Elements in Background/Flanks */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.08); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(180deg); }
      100% { transform: translateY(0px) rotate(360deg); }
    }
    @keyframes waveFlow {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -100; }
    }

    .pulsing-orb-1 { animation: pulseGlow 6s ease-in-out infinite; transform-origin: 150px 100px; }
    .pulsing-orb-2 { animation: pulseGlow 8s ease-in-out infinite; transform-origin: 1050px 220px; }
    .floating-card-1 { animation: floatParticle 7s ease-in-out infinite; transform-origin: center; }
    .floating-card-2 { animation: floatParticle 9s ease-in-out infinite; transform-origin: center; }
    .flowing-line { stroke-dasharray: 12, 12; animation: waveFlow 20s linear infinite; }
  </style>

  <!-- Base Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40"/>
    </pattern>
    <rect width="1200" height="320" fill="url(#grid)"/>
  </g>

  <!-- DYNAMIC / ANIMATED BACKGROUND ELEMENTS (Positioned safely away from center text) -->
  <circle class="pulsing-orb-1" cx="150" cy="100" r="140" fill="#06b6d4" opacity="0.15" filter="url(#glow)"/>
  <circle class="pulsing-orb-2" cx="1050" cy="220" r="160" fill="#8b5cf6" opacity="0.18" filter="url(#glow)"/>

  <!-- Geometric Abstract Lines -->
  <path class="flowing-line" d="M -50,260 Q 250,140 550,280 T 1250,180" fill="none" stroke="#ec4899" stroke-width="2" opacity="0.3"/>
  <path class="flowing-line" d="M -50,60 Q 350,220 750,80 T 1250,120" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.25"/>

  <!-- Left Decorative Controller Graphic (Floating Flank) -->
  <g class="floating-card-1" transform="translate(80, 150)">
    <rect x="-40" y="-35" width="80" height="70" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2" opacity="0.8"/>
    <!-- Controller Icon -->
    <path d="M-18 -8 C-22 -8 -25 -5 -25 0 C-25 10 -18 16 -12 16 C-8 16 -6 13 -4 10 L4 10 C6 13 8 16 12 16 C18 16 25 10 25 0 C25 -5 22 -8 18 -8 Z" fill="none" stroke="#06b6d4" stroke-width="2.5" filter="url(#subtleGlow)"/>
    <circle cx="-12" cy="-2" r="2.5" fill="#38bdf8"/>
    <circle cx="-12" cy="4" r="2.5" fill="#38bdf8"/>
    <circle cx="14" cy="1" r="2.5" fill="#ec4899"/>
    <circle cx="10" cy="-3" r="2.5" fill="#a855f7"/>
  </g>

  <!-- Right Decorative Server Graphic (Floating Flank) -->
  <g class="floating-card-2" transform="translate(1100, 110)">
    <rect x="-45" y="-40" width="90" height="80" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2" opacity="0.8"/>
    <rect x="-30" y="-25" width="60" height="12" rx="3" fill="#334155"/>
    <circle cx="20" cy="-19" r="2.5" fill="#10b981"/>
    <rect x="-30" y="-5" width="60" height="12" rx="3" fill="#334155"/>
    <circle cx="20" cy="1" r="2.5" fill="#10b981"/>
    <rect x="-30" y="15" width="60" height="12" rx="3" fill="#334155"/>
    <circle cx="20" cy="21" r="2.5" fill="#38bdf8"/>
  </g>

  <!-- MAIN FOREGROUND CONTAINER (Guaranteed Foreground Legibility) -->
  <g transform="translate(600, 160)" text-anchor="middle">
    <!-- Top Pill Badge -->
    <g transform="translate(0, -90)">
      <rect x="-170" y="-16" width="340" height="32" rx="16" fill="#0f172a" stroke="url(#cyanPurple)" stroke-width="1.5" filter="url(#subtleGlow)"/>
      <text class="badge-text" x="0" y="5" text-anchor="middle">🎮 CURATED MOBILE GAMING STACK ⚡</text>
    </g>

    <!-- Main Title -->
    <text class="title" x="0" y="-20">Awesome Mobile Gaming Companion App</text>
    
    <!-- Decorative Gradient Underline -->
    <rect x="-220" y="0" width="440" height="4" rx="2" fill="url(#cyanPurple)" filter="url(#subtleGlow)"/>

    <!-- Subtitle -->
    <text class="subtitle" x="0" y="38">Console Companions • Open-Source Game Server Panels • Crew Voice &amp; Streaming</text>
  </g>
</svg>
